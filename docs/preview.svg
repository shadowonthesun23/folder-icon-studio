<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Folder Icon Studio preview</title>
  <desc id="desc">A stylized preview banner for Folder Icon Studio showing a dark interface, controls, and a custom folder icon.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.32"/>
      <stop offset="42%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18181b"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="folderTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="folderBody" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f97316"/>
      <stop offset="0.45" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="#09090b"/>
  <rect width="1280" height="720" fill="url(#bgGlow)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <text x="72" y="92" fill="#f4f4f5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="800">Folder Icon Studio</text>
  <text x="72" y="132" fill="#a1a1aa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Create custom folder icons in your browser · PNG · ICNS · ICO</text>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="1140" height="456" rx="34" fill="#111114" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="70" y="178" width="370" height="456" rx="34" fill="url(#panel)"/>
    <path d="M440 178V634" stroke="#ffffff" stroke-opacity="0.08"/>

    <g transform="translate(104 218)">
      <rect width="302" height="82" rx="18" fill="#09090b" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="31" fill="#d4d4d8" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">1. Artwork</text>
      <rect x="22" y="48" width="72" height="14" rx="7" fill="#3b82f6" opacity="0.85"/>
      <rect x="104" y="48" width="86" height="14" rx="7" fill="#27272a"/>
      <rect x="200" y="48" width="70" height="14" rx="7" fill="#27272a"/>
    </g>

    <g transform="translate(104 318)">
      <rect width="302" height="118" rx="18" fill="#09090b" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="31" fill="#d4d4d8" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">2. Label</text>
      <rect x="22" y="48" width="78" height="28" rx="10" fill="#1d4ed8" fill-opacity="0.28" stroke="#3b82f6" stroke-opacity="0.65"/>
      <text x="42" y="67" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="700">Dymo</text>
      <rect x="110" y="48" width="82" height="28" rx="10" fill="#18181b" stroke="#3f3f46"/>
      <rect x="202" y="48" width="78" height="28" rx="10" fill="#18181b" stroke="#3f3f46"/>
      <rect x="22" y="90" width="210" height="10" rx="5" fill="#27272a"/>
      <rect x="22" y="90" width="138" height="10" rx="5" fill="#8b5cf6"/>
    </g>

    <g transform="translate(104 454)">
      <rect width="302" height="92" rx="18" fill="#09090b" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="31" fill="#d4d4d8" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">3. Saved styles</text>
      <circle cx="30" cy="60" r="10" fill="#f59e0b"/>
      <circle cx="58" cy="60" r="10" fill="#22c55e"/>
      <circle cx="86" cy="60" r="10" fill="#ec4899"/>
      <rect x="118" y="52" width="104" height="16" rx="8" fill="#27272a"/>
    </g>

    <g transform="translate(496 238)">
      <rect x="0" y="0" width="650" height="336" rx="28" fill="#09090b" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="0" y="0" width="650" height="336" rx="28" fill="url(#dots)" opacity="0.7"/>

      <g transform="translate(167 55)" filter="url(#shadow)">
        <path d="M39 36C39 22.745 49.745 12 63 12H150C171 12 176 31 191 31H309C322.255 31 333 41.745 333 55V95H39V36Z" fill="url(#folderTop)"/>
        <rect x="22" y="71" width="332" height="210" rx="31" fill="url(#folderBody)"/>
        <rect x="54" y="102" width="268" height="138" rx="22" fill="url(#art)" opacity="0.94"/>
        <path d="M54 212C102 164 132 171 176 210C219 248 260 231 322 176V218C322 230.15 312.15 240 300 240H76C63.85 240 54 230.15 54 218V212Z" fill="#0f172a" opacity="0.38"/>
        <rect x="100" y="224" width="182" height="44" rx="8" transform="rotate(-3 100 224)" fill="#f5e8c7"/>
        <text x="130" y="253" transform="rotate(-3 130 253)" fill="#18181b" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">Project X</text>
      </g>

      <g transform="translate(451 250)">
        <rect width="128" height="42" rx="16" fill="#18181b" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="21" y="27" fill="#e4e4e7" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">Download</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 660)">
    <rect width="188" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="23" fill="#d4d4d8" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="600">folder-icon-studio.vercel.app</text>
  </g>
</svg>
